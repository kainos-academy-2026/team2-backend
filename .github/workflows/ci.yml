name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: ["**"]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Display lint start message
        run: echo "Lint checks started"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Display lint complete message
        run: echo "Lint checks passed"

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Display test start message
        run: echo "Test checks started"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build TypeScript
        run: npm run build

      - name: Run unit and API tests
        run: npx vitest run --exclude tests/integration/**

      - name: Display test complete message
        run: echo "Test checks passed"

  build:
    name: Build Container Image
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Display build start message
        run: echo "Container build started"

      - name: Set Docker image tags
        run: |
          echo "IMAGE_NAME=team2-backend" >> "$GITHUB_ENV"
          echo "IMAGE_TAG_SHA=${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG_CI=ci-${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Build Docker image
        run: |
          docker build \
            --file Dockerfile \
            --tag "${IMAGE_NAME}:${IMAGE_TAG_SHA}" \
            --tag "${IMAGE_NAME}:${IMAGE_TAG_CI}" \
            .

      - name: Display pipeline complete message
        run: echo "Pipeline passed"
