name: CI

permissions:
  contents: read
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: ["main"]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Display lint start message
        run: echo "Lint checks started"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Display lint complete message
        run: echo "Lint checks passed"

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Display test start message
        run: echo "Test checks started"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build TypeScript
        run: npm run build

      - name: Run unit and API tests
        run: npx vitest run --exclude tests/integration/**

      - name: Display test complete message
        run: echo "Test checks passed"

  build:
    name: Build Container Image
    runs-on: ubuntu-latest
    needs: [lint, test]
    env:
      ACR_REGISTRY: acraiacademy26.azurecr.io
      ACR_IMAGE: acraiacademy26.azurecr.io/team2-backend
    outputs:
      image_pushed: ${{ steps.acr-push-check.outputs.image_pushed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Display build start message
        run: echo "Container build started"

      - name: Create placeholder corporate cert for CI build context
        run: |
          mkdir -p docker/certs
          openssl req -x509 -newkey rsa:2048 -sha256 -days 365 -nodes \
            -keyout /tmp/ci-placeholder-ca.key \
            -out docker/certs/corporate-ca-bundle.crt \
            -subj "/CN=ci-placeholder-ca"
          rm -f /tmp/ci-placeholder-ca.key

      - name: Set Docker image tags
        run: |
          echo "IMAGE_TAG_SHA=${GITHUB_SHA::8}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG_CI=ci-${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Determine whether ACR push is enabled
        id: acr-push-check
        run: |
          if [[ "${GITHUB_REF}" == "refs/heads/main" && "${GITHUB_EVENT_NAME}" == "push" ]]; then
            echo "image_pushed=true" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_EVENT_NAME}" == "pull_request" && "${{ github.event.pull_request.head.repo.full_name }}" == "${GITHUB_REPOSITORY}" ]]; then
            echo "image_pushed=true" >> "$GITHUB_OUTPUT"
          else
            echo "image_pushed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Docker image
        run: |
          docker build \
            --file Dockerfile \
            --tag "${ACR_IMAGE}:${IMAGE_TAG_SHA}" \
            --tag "${ACR_IMAGE}:${IMAGE_TAG_CI}" \
            .

      - name: Log in to Azure Container Registry
        if: >
          (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
          (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.AZURE_CLIENT_ID }}
          password: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Push image to ACR (main branch)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          docker tag "${ACR_IMAGE}:${IMAGE_TAG_SHA}" "${ACR_IMAGE}:latest"
          docker push "${ACR_IMAGE}:${IMAGE_TAG_SHA}"
          docker push "${ACR_IMAGE}:${IMAGE_TAG_CI}"
          docker push "${ACR_IMAGE}:latest"

      - name: Push PR image to ACR (same-repo PRs only)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          docker tag "${ACR_IMAGE}:${IMAGE_TAG_SHA}" "${ACR_IMAGE}:pr-${{ github.event.pull_request.number }}"
          docker push "${ACR_IMAGE}:pr-${{ github.event.pull_request.number }}"

      - name: Display pipeline complete message
        run: echo "Pipeline passed"

  terraform:
    name: Terraform (plan/apply)
    runs-on: ubuntu-latest
    needs: [build]
    if: needs.build.outputs.image_pushed == 'true'
    concurrency:
      group: terraform-dev
      cancel-in-progress: false
    env:
      TF_IN_AUTOMATION: "true"
      TF_VAR_environment: dev
      TF_VAR_project_name: team2-backend
      TF_VAR_frontend_image_name: team2-frontend
      TF_VAR_frontend_image_tag: latest
      TF_VAR_frontend_container_port: "3000"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TFSTATE_RG: ${{ secrets.TFSTATE_RESOURCE_GROUP_NAME }}
      TFSTATE_STORAGE: ${{ secrets.TFSTATE_STORAGE_ACCOUNT_NAME }}
      TFSTATE_CONTAINER: ${{ secrets.TFSTATE_CONTAINER_NAME }}
      TFSTATE_KEY: team2-backend-dev.tfstate
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: '{"clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}","clientId":"${{ secrets.AZURE_CLIENT_ID }}"}'

      - name: Terraform env preflight
        working-directory: my-infrastructure
        run: |
          required_vars=(
            ARM_CLIENT_ID
            ARM_CLIENT_SECRET
            ARM_TENANT_ID
            ARM_SUBSCRIPTION_ID
            TFSTATE_RG
            TFSTATE_STORAGE
            TFSTATE_CONTAINER
            TFSTATE_KEY
          )

          missing=0
          for v in "${required_vars[@]}"; do
            if [ -z "${!v:-}" ]; then
              echo "Missing required environment variable: $v"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo "Terraform preflight failed: required backend/auth environment variables are missing."
            exit 1
          fi

      - name: Terraform init (remote state)
        working-directory: my-infrastructure
        run: |
          terraform init -input=false -no-color \
            -backend-config="resource_group_name=${TFSTATE_RG}" \
            -backend-config="storage_account_name=${TFSTATE_STORAGE}" \
            -backend-config="container_name=${TFSTATE_CONTAINER}" \
            -backend-config="key=${TFSTATE_KEY}" \
            -backend-config="use_azuread_auth=true"

      - name: Import existing database-url secret (if present)
        working-directory: my-infrastructure
        run: |
          KV_NAME="${TF_VAR_project_name}-${TF_VAR_environment}-kv"
          SECRET_ID="$(az keyvault secret show --vault-name "$KV_NAME" --name database-url --query id -o tsv 2>/dev/null || true)"

          if [ -z "$SECRET_ID" ]; then
            echo "No existing database-url secret found in Key Vault ($KV_NAME). Terraform will create it."
            exit 0
          fi

          if terraform state show azurerm_key_vault_secret.database_url >/dev/null 2>&1; then
            echo "database-url secret is already managed in Terraform state."
            exit 0
          fi

          terraform import -input=false -no-color azurerm_key_vault_secret.database_url "$SECRET_ID"

      - name: Terraform validate
        working-directory: my-infrastructure
        run: terraform validate -no-color

      - name: Terraform fmt check
        working-directory: my-infrastructure
        run: terraform fmt -check -recursive

      - name: Terraform plan
        working-directory: my-infrastructure
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Terraform apply (main branch)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: my-infrastructure
        run: terraform apply -input=false -no-color -auto-approve tfplan

      - name: Prisma migrate deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          KV_NAME="${TF_VAR_project_name}-${TF_VAR_environment}-kv"
          DATABASE_URL="$(az keyvault secret show --vault-name "$KV_NAME" --name database-url --query value -o tsv)"
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret value is empty or missing in Key Vault: $KV_NAME"
            exit 1
          fi

          export DATABASE_URL
          npm ci
          npx prisma migrate deploy
