name: Natalie's Workflow

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run Tests & Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client  # ⭐ Add this step
        run: npx prisma generate

      - name: Run tests
        run: npm test

      - name: Display test message
        run: echo "Tests completed successfully! ✅"
            
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t my-app:${{ github.sha }} .
          docker build -t my-app:latest .

      - name: Verify image was created
        run: docker images | grep my-app

      - name: Display build message
        run: echo "Docker image built successfully! ✅"
  
      