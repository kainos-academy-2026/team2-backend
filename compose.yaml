services:
  api:
    image: team2-backend:1.0.0
    build:
      context: .
    container_name: jobs-api
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      CORS_ORIGIN: http://localhost:3001
      DATABASE_URL: postgresql://jobs_user:jobs_password@postgres:5432/jobs_db
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    container_name: jobs-api-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: jobs_db
      POSTGRES_USER: jobs_user
      POSTGRES_PASSWORD: jobs_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobs_user -d jobs_db"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
